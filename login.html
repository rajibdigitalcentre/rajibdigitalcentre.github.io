<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Rajib Digital Centre</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:#080414;
    color:white;
}

/* ANIMATED BACKGROUND */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:-1;
    background:
    radial-gradient(circle at 20% 20%,#461080 0%,transparent 40%),
    radial-gradient(circle at 80% 80%,#25106e 0%,transparent 40%),
    linear-gradient(135deg,#080414,#110626,#080414);
}

.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(65px);
    opacity:.65;
    animation:float 12s infinite alternate ease-in-out;
}

.orb1{
    width:300px;
    height:300px;
    background:#a020f0;
    top:5%;
    left:5%;
}

.orb2{
    width:350px;
    height:350px;
    background:#5425ff;
    bottom:0;
    right:0;
    animation-delay:2s;
}

.orb3{
    width:200px;
    height:200px;
    background:#e000ff;
    top:50%;
    left:50%;
    animation-delay:4s;
}

@keyframes float{
    from{
        transform:translate(0,0) scale(1);
    }
    to{
        transform:translate(80px,-60px) scale(1.3);
    }
}

/* PARTICLES */

.particle{
    position:absolute;
    width:3px;
    height:3px;
    background:#fff;
    border-radius:50%;
    opacity:.6;
    animation:particle 8s linear infinite;
}

@keyframes particle{
    0%{
        transform:translateY(100vh);
        opacity:0;
    }
    50%{
        opacity:1;
    }
    100%{
        transform:translateY(-100vh);
        opacity:0;
    }
}

/* LOGIN CARD */

.container{
    width:420px;
    max-width:92%;
    padding:38px 32px;
    position:relative;
    border-radius:25px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.15);
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
    box-shadow:
    0 0 40px rgba(153,0,255,.18),
    inset 0 0 25px rgba(255,255,255,.03);
    animation:appear .8s ease;
}

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(35px) scale(.95);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

/* LOGO */

.logo{
    width:75px;
    height:75px;
    margin:0 auto 18px;
    border-radius:22px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:35px;
    font-weight:800;
    background:linear-gradient(135deg,#a100ff,#6235ff);
    box-shadow:0 0 35px rgba(161,0,255,.65);
    animation:glow 3s infinite alternate;
}

@keyframes glow{
    from{
        box-shadow:0 0 15px #8a00ff;
    }
    to{
        box-shadow:0 0 40px #bd40ff;
    }
}

h1{
    text-align:center;
    font-size:25px;
    font-weight:800;
    letter-spacing:1px;
}

.subtitle{
    text-align:center;
    color:#c5b5e9;
    font-size:12px;
    margin-top:9px;
    margin-bottom:28px;
}

/* FORM */

.form-group{
    margin-bottom:17px;
}

label{
    display:block;
    font-size:12px;
    font-weight:600;
    margin-bottom:8px;
    color:#e3d5ff;
}

.input-box{
    position:relative;
}

.input-box input{
    width:100%;
    padding:15px 15px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.13);
    outline:none;
    color:white;
    background:rgba(255,255,255,.07);
    font-size:13px;
    transition:.3s;
}

.input-box input:focus{
    border-color:#b34aff;
    box-shadow:0 0 15px rgba(179,74,255,.25);
}

.input-box input::placeholder{
    color:#9384ac;
}

.toggle-password{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    font-size:12px;
    color:#c9a5ff;
}

/* FORGOT PASSWORD */

.forgot{
    display:block;
    text-align:right;
    font-size:12px;
    color:#c18aff;
    cursor:pointer;
    margin-top:-5px;
    margin-bottom:20px;
}

.forgot:hover{
    color:white;
}

/* BUTTON */

.main-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:linear-gradient(100deg,#8c00ff,#542dff,#bd35ff);
    background-size:200%;
    color:white;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
    transition:.4s;
    box-shadow:0 5px 25px rgba(133,0,255,.3);
}

.main-btn:hover{
    background-position:right;
    transform:translateY(-2px);
    box-shadow:0 8px 30px rgba(160,0,255,.5);
}

.main-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

.switch-text{
    text-align:center;
    margin-top:23px;
    color:#c8badf;
    font-size:12px;
}

.switch-text span{
    color:#c57aff;
    font-weight:700;
    cursor:pointer;
}

.switch-text span:hover{
    color:white;
}

/* HIDE SIGNUP */

#signupForm{
    display:none;
}

/* FOOTER */

.footer{
    text-align:center;
    margin-top:25px;
    font-size:10px;
    color:#8c7ca9;
    letter-spacing:1px;
}

/* POPUP */

.popup-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(10px);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:100;
}

.popup{
    width:320px;
    max-width:90%;
    padding:35px 25px;
    border-radius:22px;
    text-align:center;
    background:linear-gradient(145deg,#211039,#10091e);
    border:1px solid rgba(180,100,255,.4);
    box-shadow:0 0 50px rgba(140,0,255,.35);
    animation:popup .4s ease;
}

@keyframes popup{
    from{
        opacity:0;
        transform:scale(.7);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.popup-icon{
    font-size:45px;
    margin-bottom:15px;
}

.popup h2{
    font-size:20px;
    margin-bottom:10px;
}

.popup p{
    font-size:12px;
    color:#c8b9df;
    line-height:1.6;
}

.popup button{
    margin-top:22px;
    padding:12px 35px;
    border:0;
    border-radius:10px;
    color:white;
    background:linear-gradient(90deg,#8500ff,#542dff);
    cursor:pointer;
}

/* MOBILE */

@media(max-width:480px){

    .container{
        padding:32px 23px;
    }

    h1{
        font-size:22px;
    }

    .logo{
        width:68px;
        height:68px;
    }

}

</style>
</head>

<body>

<div class="background">

    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>

</div>

<!-- PARTICLES -->

<script>
for(let i=0;i<35;i++){

    let p=document.createElement("div");

    p.className="particle";

    p.style.left=Math.random()*100+"%";

    p.style.animationDuration=(5+Math.random()*10)+"s";

    p.style.animationDelay=Math.random()*8+"s";

    document.body.appendChild(p);

}
</script>


<!-- LOGIN CONTAINER -->

<div class="container">

    <div class="logo">R</div>

    <h1>RAJIB DIGITAL CENTRE</h1>

    <p class="subtitle">
        Secure Access • Smart Digital Services
    </p>


    <!-- LOGIN FORM -->

    <form id="loginForm">

        <div class="form-group">

            <label>Email Address</label>

            <div class="input-box">

                <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required>

            </div>

        </div>


        <div class="form-group">

            <label>Password</label>

            <div class="input-box">

                <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required>

                <span
                class="toggle-password"
                onclick="togglePassword('loginPassword',this)">
                SHOW
                </span>

            </div>

        </div>


        <span class="forgot" onclick="forgotPassword()">
            Forgot Password?
        </span>


        <button class="main-btn" id="loginBtn" type="submit">

            LOGIN TO ACCOUNT →

        </button>


        <p class="switch-text">

            Don't have an account?

            <span onclick="showSignup()">
                Create Account

            </span>

        </p>

    </form>


    <!-- SIGNUP FORM -->

    <form id="signupForm">

        <div class="form-group">

            <label>Full Name</label>

            <input
            type="text"
            id="signupName"
            placeholder="Enter your full name"
            required
            style="width:100%;padding:15px;border-radius:12px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.07);color:white;outline:none;">

        </div>


        <div class="form-group">

            <label>Email Address</label>

            <input
            type="email"
            id="signupEmail"
            placeholder="Enter your email"
            required
            style="width:100%;padding:15px;border-radius:12px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.07);color:white;outline:none;">

        </div>


        <div class="form-group">

            <label>Create Password</label>

            <div class="input-box">

                <input
                type="password"
                id="signupPassword"
                placeholder="Minimum 6 characters"
                minlength="6"
                required>

                <span
                class="toggle-password"
                onclick="togglePassword('signupPassword',this)">
                SHOW
                </span>

            </div>

        </div>


        <button class="main-btn" id="signupBtn" type="submit">

            CREATE MY ACCOUNT →

        </button>


        <p class="switch-text">

            Already have an account?

            <span onclick="showLogin()">
                Login Now

            </span>

        </p>

    </form>


    <div class="footer">

        POWERED BY RAJIB DIGITAL CENTRE

        <br><br>

        © 2026 ALL RIGHTS RESERVED

    </div>

</div>


<!-- POPUP -->

<div class="popup-overlay" id="popupOverlay">

    <div class="popup">

        <div class="popup-icon" id="popupIcon">
            ✓
        </div>

        <h2 id="popupTitle">
            Success!
        </h2>

        <p id="popupMessage">
            Operation completed successfully.
        </p>

        <button onclick="closePopup()">
            CONTINUE
        </button>

    </div>

</div>


<!-- FIREBASE AUTHENTICATION -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {

    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    updateProfile,
    onAuthStateChanged

}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


// FIREBASE CONFIGURATION

const firebaseConfig = {

    apiKey: "AIzaSyA7Fn3sXqXxLH37LFr47XEOdcbWNE5LiMw",

    authDomain: "rajib-digital-centre.firebaseapp.com",

    projectId: "rajib-digital-centre",

    storageBucket: "rajib-digital-centre.firebasestorage.app",

    messagingSenderId: "400866818079",

    appId: "1:400866818079:web:d3686ec90fdcdc780b7d2a",

    measurementId: "G-7E2DXWT8M2"

};


// INITIALIZE FIREBASE

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


// POPUP FUNCTION

function showPopup(title,message,icon="✓"){

    document.getElementById("popupTitle").innerText=title;

    document.getElementById("popupMessage").innerText=message;

    document.getElementById("popupIcon").innerText=icon;

    document.getElementById("popupOverlay").style.display="flex";

}

window.closePopup=function(){

    document.getElementById("popupOverlay").style.display="none";

};


// SWITCH FORMS

window.showSignup=function(){

    document.getElementById("loginForm").style.display="none";

    document.getElementById("signupForm").style.display="block";

};

window.showLogin=function(){

    document.getElementById("signupForm").style.display="none";

    document.getElementById("loginForm").style.display="block";

};


// SHOW/HIDE PASSWORD

window.togglePassword=function(id,element){

    const input=document.getElementById(id);

    if(input.type==="password"){

        input.type="text";

        element.innerText="HIDE";

    }else{

        input.type="password";

        element.innerText="SHOW";

    }

};


// AUTHENTICATION STATE

onAuthStateChanged(auth,(user)=>{

    if(user){

        window.location.replace("index.html");

    }

});


// CREATE ACCOUNT

document.getElementById("signupForm")
.addEventListener("submit",async(e)=>{

    e.preventDefault();

    const name=document.getElementById("signupName").value.trim();

    const email=document.getElementById("signupEmail").value.trim();

    const password=document.getElementById("signupPassword").value;

    const btn=document.getElementById("signupBtn");

    btn.disabled=true;

    btn.innerText="CREATING ACCOUNT...";

    try{

        const result=await createUserWithEmailAndPassword(
            auth,
            email,
            password
        );

        await updateProfile(result.user,{
            displayName:name
        });

        showPopup(
            "ACCOUNT CREATED!",
            "Welcome to Rajib Digital Centre. Your account has been created successfully!",
            "🎉"
        );

    }

    catch(error){

        showPopup(
            "REGISTRATION FAILED",
            getErrorMessage(error.code),
            "⚠️"
        );

    }

    finally{

        btn.disabled=false;

        btn.innerText="CREATE MY ACCOUNT →";

    }

});


// LOGIN

document.getElementById("loginForm")
.addEventListener("submit",async(e)=>{

    e.preventDefault();

    const email=document.getElementById("loginEmail").value.trim();

    const password=document.getElementById("loginPassword").value;

    const btn=document.getElementById("loginBtn");

    btn.disabled=true;

    btn.innerText="AUTHENTICATING...";

    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        showPopup(
            "LOGIN SUCCESSFUL!",
            "Welcome back! Redirecting to Rajib Digital Centre...",
            "🚀"
        );

        setTimeout(()=>{

            window.location.replace("index.html");

        },1200);

    }

    catch(error){

        showPopup(
            "LOGIN FAILED",
            getErrorMessage(error.code),
            "⚠️"
        );

    }

    finally{

        btn.disabled=false;

        btn.innerText="LOGIN TO ACCOUNT →";

    }

});


// FORGOT PASSWORD

window.forgotPassword=async function(){

    const email=document.getElementById("loginEmail").value.trim();

    if(!email){

        showPopup(
            "EMAIL REQUIRED",
            "Please enter your registered email address first.",
            "📧"
        );

        return;

    }

    try{

        await sendPasswordResetEmail(auth,email);

        showPopup(
            "RESET EMAIL SENT",
            "Password reset instructions have been sent to your email.",
            "📩"
        );

    }

    catch(error){

        showPopup(
            "ERROR",
            getErrorMessage(error.code),
            "⚠️"
        );

    }

};


// ERROR HANDLING

function getErrorMessage(code){

    const errors={

        "auth/email-already-in-use":
        "This email is already registered. Please login.",

        "auth/invalid-email":
        "Please enter a valid email address.",

        "auth/weak-password":
        "Password must contain at least 6 characters.",

        "auth/user-not-found":
        "No account found with this email.",

        "auth/wrong-password":
        "Incorrect password. Please try again.",

        "auth/invalid-credential":
        "Invalid email or password.",

        "auth/too-many-requests":
        "Too many attempts. Please try again later.",

        "auth/network-request-failed":
        "Network error. Please check your internet connection.",

        "auth/operation-not-allowed":
        "Email/Password login is not enabled in Firebase."

    };

    return errors[code] || "Something went wrong. Please try again.";

}

</script>

</body>
</html>
