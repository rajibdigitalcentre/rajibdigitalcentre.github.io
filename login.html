<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Rajib Digital Centre</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-deep: #070514;
      --bg-mid: #120b2e;
      --bg-blue: #0b1437;
      --purple: #7c3aed;
      --violet: #a855f7;
      --blue: #3b82f6;
      --cyan: #38bdf8;
      --glass-bg: rgba(18, 16, 40, 0.58);
      --glass-border: rgba(255, 255, 255, 0.13);
      --glass-highlight: rgba(255, 255, 255, 0.06);
      --input-bg: rgba(255, 255, 255, 0.055);
      --input-border: rgba(255, 255, 255, 0.14);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      background: radial-gradient(circle at 15% 15%, #231157 0%, transparent 45%),
                  radial-gradient(circle at 85% 85%, #112466 0%, transparent 48%),
                  linear-gradient(135deg, var(--bg-deep) 0%, var(--bg-mid) 50%, var(--bg-blue) 100%);
      color: var(--text-main);
      overflow-x: hidden;
      position: relative;
    }

    /* Animated Ambient Background */
    .bg-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: radial-gradient(circle at center, rgba(0,0,0,0.85) 20%, transparent 80%);
      -webkit-mask-image: radial-gradient(circle at center, rgba(0,0,0,0.85) 20%, transparent 80%);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.48;
      will-change: transform;
    }

    .orb-1 {
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, #7c3aed, #4c1d95);
      top: -110px;
      left: -90px;
      animation: floatOrb1 14s ease-in-out infinite alternate;
    }

    .orb-2 {
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, #2563eb, #1e3a8a);
      bottom: -100px;
      right: -80px;
      animation: floatOrb2 16s ease-in-out infinite alternate;
    }

    .orb-3 {
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, #c026d3, #6d28d9);
      top: 45%;
      left: 55%;
      opacity: 0.28;
      animation: floatOrb3 18s ease-in-out infinite alternate;
    }

    @keyframes floatOrb1 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(55px, 45px) scale(1.12); }
    }

    @keyframes floatOrb2 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-50px, -40px) scale(1.1); }
    }

    @keyframes floatOrb3 {
      0% { transform: translate(-40%, -40%) scale(0.95); }
      100% { transform: translate(20%, 15%) scale(1.15); }
    }

    /* Main Auth Container */
    .auth-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 440px;
      animation: cardEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardEntrance {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(26px);
      -webkit-backdrop-filter: blur(26px);
      border: 1px solid var(--glass-border);
      border-radius: 26px;
      padding: 32px 28px 28px;
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(255, 255, 255, 0.05) inset,
        0 0 40px rgba(124, 58, 237, 0.16);
      position: relative;
      overflow: hidden;
    }

    .glass-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(168, 85, 247, 0.7), rgba(56, 189, 248, 0.7), transparent);
    }

    /* Brand Header */
    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-badge {
      width: 54px;
      height: 54px;
      margin: 0 auto 14px;
      border-radius: 16px;
      background: linear-gradient(135deg, #7c3aed, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 26px rgba(124, 58, 237, 0.45);
      position: relative;
    }

    .brand-badge svg {
      width: 28px;
      height: 28px;
      color: #ffffff;
    }

    .brand-title {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 0.4px;
      background: linear-gradient(135deg, #ffffff 30%, #c4b5fd 75%, #93c5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .brand-subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* Primary Switcher: Login vs Create Account */
    .mode-switcher {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 22px;
    }

    .mode-slider {
      position: absolute;
      top: 4px;
      left: 4px;
      width: calc(50% - 4px);
      height: calc(100% - 8px);
      border-radius: 10px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      box-shadow: 0 6px 18px rgba(124, 58, 237, 0.42);
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 0;
    }

    .mode-switcher.register-active .mode-slider {
      transform: translateX(100%);
    }

    .mode-btn {
      position: relative;
      z-index: 1;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13.5px;
      font-weight: 600;
      padding: 10px 12px;
      cursor: pointer;
      transition: color 0.25s ease;
      border-radius: 10px;
    }

    .mode-btn.active {
      color: #ffffff;
    }

    /* Login Method Sub-tabs (Email vs Phone OTP) */
    .sub-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .sub-tab-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 10px;
      border-radius: 11px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .sub-tab-btn svg {
      width: 15px;
      height: 15px;
    }

    .sub-tab-btn:hover {
      background: rgba(255, 255, 255, 0.07);
      color: #e2e8f0;
    }

    .sub-tab-btn.active {
      background: rgba(124, 58, 237, 0.2);
      border-color: rgba(168, 85, 247, 0.55);
      color: #ffffff;
      box-shadow: 0 0 16px rgba(124, 58, 237, 0.2);
    }

    /* Form Views & Transitions */
    .view-panel {
      display: none;
      animation: fadeSlideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .view-panel.active {
      display: block;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Input Fields */
    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
      margin-left: 2px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      color: #94a3b8;
      pointer-events: none;
      transition: color 0.25s ease;
    }

    .input-field {
      width: 100%;
      padding: 12.5px 42px 12.5px 42px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 13px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 500;
      outline: none;
      transition: all 0.25s ease;
    }

    .input-field::placeholder {
      color: #64748b;
      font-weight: 400;
    }

    .input-field:hover {
      border-color: rgba(255, 255, 255, 0.24);
      background: rgba(255, 255, 255, 0.07);
    }

    .input-field:focus {
      border-color: #a855f7;
      background: rgba(124, 58, 237, 0.09);
      box-shadow: 0 0 0 3.5px rgba(168, 85, 247, 0.18);
    }

    .input-wrap:focus-within .input-icon {
      color: #c084fc;
    }

    .toggle-pw {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: color 0.2s ease, background 0.2s ease;
    }

    .toggle-pw:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }

    .toggle-pw svg {
      width: 18px;
      height: 18px;
    }

    /* Password Strength Bar */
    .strength-wrap {
      margin-top: 7px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .strength-bar {
      flex: 1;
      height: 4px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    .strength-fill {
      height: 100%;
      width: 0%;
      border-radius: 99px;
      transition: width 0.3s ease, background 0.3s ease;
    }

    .strength-text {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      min-width: 52px;
      text-align: right;
    }

    /* Remember Me & Forgot Password Row */
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 0 18px;
      font-size: 13px;
    }

    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #cbd5e1;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-label input {
      accent-color: #8b5cf6;
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    .text-link {
      background: none;
      border: none;
      color: #c084fc;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .text-link:hover {
      color: #e9d5ff;
      text-decoration: underline;
    }

    /* Primary Animated Button */
    .btn-primary {
      width: 100%;
      padding: 13.5px 18px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(135deg, #7c3aed 0%, #6366f1 50%, #3b82f6 100%);
      background-size: 200% auto;
      color: #ffffff;
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: 0.2px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 26px rgba(124, 58, 237, 0.38);
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      overflow: hidden;
    }

    .btn-primary:hover:not(:disabled) {
      background-position: right center;
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(99, 102, 241, 0.5);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.72;
      cursor: not-allowed;
    }

    /* Loading Spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      display: none;
    }

    .btn-loading .spinner {
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: #64748b;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.14), transparent);
    }

    /* Google Sign-In Button */
    .btn-google {
      width: 100%;
      padding: 12.5px 16px;
      border-radius: 13px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.25s ease;
    }

    .btn-google:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.28);
      transform: translateY(-1.5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28);
    }

    .btn-google:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* Phone OTP Extras */
    #recaptcha-container {
      margin: 12px 0 14px;
      display: flex;
      justify-content: center;
      overflow: hidden;
      border-radius: 10px;
    }

    .otp-reveal {
      display: none;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px dashed rgba(255, 255, 255, 0.14);
      animation: fadeSlideIn 0.35s ease;
    }

    .otp-reveal.show {
      display: block;
    }

    .card-footer-note {
      text-align: center;
      margin-top: 20px;
      font-size: 12.5px;
      color: var(--text-muted);
    }

    /* Modern Toast Notification System */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 360px;
      width: calc(100% - 32px);
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(17, 15, 38, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      color: #ffffff;
      position: relative;
      overflow: hidden;
      animation: toastIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .toast.hiding {
      animation: toastOut 0.3s ease forwards;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(30px) scale(0.95); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }

    @keyframes toastOut {
      from { opacity: 1; transform: translateX(0) scale(1); }
      to { opacity: 0; transform: translateX(30px) scale(0.95); }
    }

    .toast-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .toast.success .toast-icon { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .toast.error .toast-icon { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .toast.info .toast-icon { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }

    .toast-body { flex: 1; }
    .toast-title { font-size: 13.5px; font-weight: 700; margin-bottom: 2px; }
    .toast-msg { font-size: 12.5px; color: #cbd5e1; line-height: 1.4; }

    .toast-close {
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 0 2px;
    }
    .toast-close:hover { color: #ffffff; }

    .toast-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      width: 100%;
      transform-origin: left;
      animation: toastTimer 4.2s linear forwards;
    }

    .toast.success .toast-progress { background: linear-gradient(90deg, #10b981, #34d399); }
    .toast.error .toast-progress { background: linear-gradient(90deg, #ef4444, #f87171); }
    .toast.info .toast-progress { background: linear-gradient(90deg, #3b82f6, #38bdf8); }

    @keyframes toastTimer {
      from { transform: scaleX(1); }
      to { transform: scaleX(0); }
    }

    /* Modals (Account Created Success & Forgot Password) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 9000;
      background: rgba(5, 3, 18, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      width: 100%;
      max-width: 390px;
      background: linear-gradient(160deg, rgba(28, 22, 62, 0.96), rgba(14, 14, 38, 0.98));
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 24px;
      padding: 32px 26px 26px;
      text-align: center;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.65), 0 0 40px rgba(124, 58, 237, 0.25);
      transform: scale(0.88) translateY(16px);
      transition: transform 0.38s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.open .modal-card {
      transform: scale(1) translateY(0);
    }

    /* Animated Green Checkmark */
    .checkmark-wrap {
      width: 82px;
      height: 82px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 35px rgba(16, 185, 129, 0.35);
    }

    .checkmark-svg {
      width: 58px;
      height: 58px;
    }

    .checkmark-circle {
      stroke: #10b981;
      stroke-width: 3;
      fill: none;
      stroke-dasharray: 166;
      stroke-dashoffset: 166;
    }

    .checkmark-check {
      stroke: #34d399;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
    }

    .modal-overlay.open .checkmark-circle {
      animation: strokeDraw 0.6s cubic-bezier(0.65, 0, 0.45, 1) 0.1s forwards;
    }

    .modal-overlay.open .checkmark-check {
      animation: strokeDraw 0.35s cubic-bezier(0.65, 0, 0.45, 1) 0.55s forwards;
    }

    @keyframes strokeDraw {
      to { stroke-dashoffset: 0; }
    }

    .modal-title {
      font-size: 21px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .modal-message {
      font-size: 14px;
      color: #cbd5e1;
      line-height: 1.55;
      margin-bottom: 24px;
    }

    .btn-success-cta {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.6px;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(
