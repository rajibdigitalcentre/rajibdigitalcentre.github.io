<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Rajib Digital Centre</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      padding: 16px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 28px 24px;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    }
    h2 {
      margin: 0 0 6px;
      text-align: center;
      color: #0f172a;
      font-size: 22px;
    }
    p.subtitle {
      margin: 0 0 20px;
      text-align: center;
      color: #64748b;
      font-size: 13px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      color: #334155;
    }
    .tab-btn.active {
      background: #1d4ed8;
      color: #ffffff;
      border-color: #1d4ed8;
    }
    .section { display: none; }
    .section.active { display: block; }
    input {
      width: 100%;
      padding: 11px 12px;
      margin-bottom: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
    }
    button.primary {
      width: 100%;
      padding: 11px;
      background: #1d4ed8;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
    }
    button.primary:hover { background: #1e40af; }
    button.secondary {
      width: 100%;
      padding: 10px;
      background: #f1f5f9;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .divider {
      text-align: center;
      margin: 14px 0;
      color: #94a3b8;
      font-size: 13px;
    }
    .google-btn {
      width: 100%;
      padding: 11px;
      background: #ffffff;
      color: #1e293b;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .google-btn:hover { background: #f8fafc; }
    #recaptcha-container { margin-bottom: 12px; }
    #status {
      margin-top: 12px;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: #dc2626;
      min-height: 18px;
    }
    #status.success { color: #16a34a; }
  </style>
</head>
<body>
  <div class="card">
    <h2>RAJIB DIGITAL CENTRE</h2>
    <p class="subtitle">Sign in to access your account</p>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('phone')">Phone OTP</button>
      <button class="tab-btn" onclick="switchTab('email')">Email</button>
    </div>

    <!-- Phone OTP Login -->
    <div id="phone-section" class="section active">
      <input type="tel" id="phone-number" placeholder="+91 9876543210" value="+91" />
      <div id="recaptcha-container"></div>
      <button class="primary" id="send-otp-btn">Send OTP</button>

      <div id="otp-box" style="display:none; margin-top:10px;">
        <input type="text" id="otp-code" placeholder="Enter 6-digit OTP" />
        <button class="primary" id="verify-otp-btn">Verify & Login</button>
      </div>
    </div>

    <!-- Email & Password Login -->
    <div id="email-section" class="section">
      <input type="email" id="email" placeholder="Email address" />
      <input type="password" id="password" placeholder="Password (min 6 characters)" />
      <button class="primary" id="email-login-btn">Login</button>
      <button class="secondary" id="email-signup-btn">Create New Account</button>
    </div>

    <div class="divider">OR</div>

    <button class="google-btn" id="google-login-btn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="Google" />
      Continue with Google
    </button>

    <div id="status"></div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
      if (tab === 'phone') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('phone-section').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('email-section').classList.add('active');
      }
      document.getElementById('status').textContent = '';
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      RecaptchaVerifier,
      signInWithPhoneNumber
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA7Fn3sXqXxLH37LFr47XEOdcbWNE5LiMw",
      authDomain: "rajib-digital-centre.firebaseapp.com",
      projectId: "rajib-digital-centre",
      storageBucket: "rajib-digital-centre.firebasestorage.app",
      messagingSenderId: "400866818079",
      appId: "1:400866818079:web:d3686ec90fdcdc780b7d2a",
      measurementId: "G-7E2DXWT8M2"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const statusEl = document.getElementById("status");

    function showStatus(msg, isSuccess = false) {
      statusEl.textContent = msg;
      statusEl.className = isSuccess ? "success" : "";
    }

    function onLoginSuccess() {
      showStatus("Login successful! Redirecting...", true);
      setTimeout(() => {
        window.location.href = "index.html";
      }, 1000);
    }

    // 1. Google Login
    document.getElementById("google-login-btn").addEventListener("click", async () => {
      const provider = new GoogleAuthProvider();
      try {
        await signInWithPopup(auth, provider);
        onLoginSuccess();
      } catch (err) {
        showStatus(err.message);
      }
    });

    // 2. Email Login & Sign Up
    document.getElementById("email-login-btn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
        onLoginSuccess();
      } catch (err) {
        showStatus(err.message);
      }
    });

    document.getElementById("email-signup-btn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      try {
        await createUserWithEmailAndPassword(auth, email, password);
        onLoginSuccess();
      } catch (err) {
        showStatus(err.message);
      }
    });

    // 3. Phone OTP Login
    window.recaptchaVerifier = new RecaptchaVerifier(auth, "recaptcha-container", {
      size: "normal"
    });

    let confirmationResult = null;

    document.getElementById("send-otp-btn").addEventListener("click", async () => {
      const phoneNumber = document.getElementById("phone-number").value.trim();
      if (!phoneNumber.startsWith("+") || phoneNumber.length < 12) {
        showStatus("সঠিক মোবাইল নম্বর দিন (যেমন: +919876543210)");
        return;
      }
      try {
        showStatus("OTP পাঠানো হচ্ছে...", true);
        confirmationResult = await signInWithPhoneNumber(auth, phoneNumber, window.recaptchaVerifier);
        document.getElementById("otp-box").style.display = "block";
        showStatus("OTP পাঠানো হয়েছে! অনুগ্রহ করে কোডটি দিন।", true);
      } catch (err) {
        showStatus(err.message);
      }
    });

    document.getElementById("verify-otp-btn").addEventListener("click", async () => {
      const code = document.getElementById("otp-code").value.trim();
      if (!confirmationResult) return;
      try {
        await confirmationResult.confirm(code);
        onLoginSuccess();
      } catch (err) {
        showStatus("ভুল OTP! আবার চেষ্টা করুন।");
      }
    });
  </script>
</body>
</html>
