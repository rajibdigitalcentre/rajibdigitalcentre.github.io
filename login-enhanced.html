<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Rajib Digital Centre</title>


<style>
:root {
  --bg: #090612;
  --panel: rgba(22, 15, 39, .78);
  --purple: #a855f7;
  --violet: #7c3aed;
  --blue: #6366f1;
  --cyan: #22d3ee;
  --text: #f8f7ff;
  --muted: #c4b5fd;
}
* { margin:0; padding:0; box-sizing:border-box; font-family:"Segoe UI",system-ui,sans-serif; }
html { min-height:100%; background:var(--bg); }
body {
  min-height:100vh; min-height:100svh; display:flex; justify-content:center; align-items:center;
  overflow-x:hidden; padding:24px 16px; color:var(--text);
  background:
    radial-gradient(ellipse at 12% 12%,rgba(126,34,206,.34),transparent 42%),
    radial-gradient(ellipse at 88% 84%,rgba(79,70,229,.34),transparent 44%),
    linear-gradient(135deg,#090612,#130b24 52%,#090817);
  position:relative; isolation:isolate;
}
body::before, body::after {
  content:""; position:fixed; width:340px; height:340px; border-radius:50%;
  filter:blur(75px); opacity:.42; z-index:-1; pointer-events:none;
  animation:orbFloat 13s ease-in-out infinite alternate;
}
body::before { background:#9333ea; top:-130px; left:-130px; }
body::after { background:#4f46e5; right:-150px; bottom:-150px; animation-delay:-6s; }
.ambient {
  position:fixed; inset:0; pointer-events:none; z-index:-1; opacity:.18;
  background-image:radial-gradient(rgba(255,255,255,.6) .7px,transparent .7px);
  background-size:27px 27px; mask-image:linear-gradient(transparent,#000 25%,#000 75%,transparent);
}
.card {
  width:100%; max-width:440px; position:relative; overflow:hidden;
  padding:38px 30px 27px; border:1px solid rgba(216,180,254,.2); border-radius:30px;
  background:linear-gradient(145deg,rgba(36,23,59,.82),rgba(14,12,29,.88));
  backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  box-shadow:0 25px 90px rgba(0,0,0,.48),0 0 45px rgba(139,92,246,.13),inset 0 1px rgba(255,255,255,.08);
  animation:cardIn .85s cubic-bezier(.2,.8,.2,1) both;
}
.card::before {
  content:""; position:absolute; inset:0 18% auto; height:1px;
  background:linear-gradient(90deg,transparent,#e9d5ff,transparent); opacity:.8;
}
.logo {
  width:76px; height:76px; margin:0 auto 4px; display:grid; place-items:center; border-radius:24px;
  font-size:34px; font-weight:800; color:white;
  background:linear-gradient(135deg,#a855f7,#6366f1 65%,#22d3ee);
  box-shadow:0 0 22px rgba(168,85,247,.55),0 0 55px rgba(99,102,241,.28),inset 0 1px rgba(255,255,255,.35);
  animation:logoPulse 3.2s ease-in-out infinite;
}
h1 { text-align:center; margin-top:22px; font-size:27px; letter-spacing:-.6px; }
.subtitle { text-align:center; color:#c4b5fd; margin:9px 0 29px; font-size:14px; }
.input-group { margin-bottom:19px; }
label { display:block; margin-bottom:9px; font-size:13px; color:#e9ddff; font-weight:600; }
input {
  width:100%; padding:15px 16px; border-radius:14px; border:1px solid rgba(216,180,254,.2);
  outline:none; background:rgba(255,255,255,.055); color:white; font-size:15px;
  transition:border-color .25s,box-shadow .25s,background .25s,transform .25s;
}
input:focus {
  border-color:#c084fc; background:rgba(168,85,247,.09);
  box-shadow:0 0 0 3px rgba(168,85,247,.16),0 0 24px rgba(139,92,246,.2);
}
input::placeholder { color:#9185aa; }
.password-box { position:relative; }
.password-box input { padding-right:68px; }
.toggle { position:absolute; right:15px; top:16px; cursor:pointer; font-size:11px; font-weight:800; letter-spacing:.7px; color:#d8b4fe; }
.forgot { text-align:right; margin-top:-6px; margin-bottom:21px; }
a { color:#d8b4fe; text-decoration:none; font-size:12px; transition:color .2s; }
a:hover { color:white; }
button {
  width:100%; min-height:54px; padding:15px; border:1px solid rgba(255,255,255,.14); border-radius:14px;
  background:linear-gradient(105deg,#9333ea,#7c3aed 48%,#5558e8);
  background-size:180% 180%; color:white; font-size:15px; font-weight:750; letter-spacing:.2px;
  cursor:pointer; position:relative; overflow:hidden;
  box-shadow:0 9px 28px rgba(124,58,237,.32),0 0 20px rgba(99,102,241,.15);
  transition:transform .25s,box-shadow .25s,filter .25s;
  animation:gradientShift 6s ease infinite;
}
button::before {
  content:""; position:absolute; top:-80%; left:-35%; width:25%; height:260%;
  background:rgba(255,255,255,.22); transform:rotate(25deg); transition:left .65s ease;
}
button:hover { transform:translateY(-3px); box-shadow:0 14px 36px rgba(124,58,237,.48),0 0 28px rgba(99,102,241,.25); filter:brightness(1.08); }
button:hover::before { left:125%; }
button:active { transform:translateY(-1px) scale(.99); }
button:disabled { opacity:.65; cursor:wait; transform:none; }
.switch { text-align:center; margin-top:26px; font-size:13px; color:#c4b5fd; }
.switch span { color:white; font-weight:750; cursor:pointer; text-shadow:0 0 12px rgba(192,132,252,.3); }
.switch span:hover { color:#e9d5ff; }
#registerForm { display:none; }
.message { margin-top:14px; text-align:center; font-size:13px; min-height:18px; color:#fda4af; line-height:1.5; }
.success { color:#86efac; }
.footer { text-align:center; margin-top:27px; font-size:11px; color:#9388a8; }
.overlay {
  position:fixed; inset:0; background:rgba(4,2,12,.78); backdrop-filter:blur(12px);
  display:none; align-items:center; justify-content:center; z-index:10; padding:20px;
}
.popup {
  width:100%; max-width:350px; padding:32px 26px 27px; border-radius:25px; text-align:center;
  background:linear-gradient(145deg,#281b43,#171329); border:1px solid rgba(216,180,254,.28);
  box-shadow:0 25px 90px rgba(0,0,0,.6),0 0 45px rgba(139,92,246,.2);
  animation:popupIn .45s cubic-bezier(.16,1,.3,1) both;
}
.popup-icon {
  width:68px; height:68px; margin:0 auto 18px; display:grid; place-items:center; border-radius:50%;
  font-size:38px; color:white; background:linear-gradient(135deg,#9333ea,#4f46e5);
  box-shadow:0 0 28px rgba(168,85,247,.45); animation:iconPop .55s .1s both;
}
.popup h2 { margin-bottom:10px; font-size:25px; }
.popup p { color:#c4b5fd; font-size:14px; line-height:1.6; margin-bottom:23px; }
@keyframes cardIn { from {opacity:0;transform:translateY(35px) scale(.97)} to {opacity:1;transform:translateY(0) scale(1)} }
@keyframes popupIn { from {opacity:0;transform:translateY(20px) scale(.94)} to {opacity:1;transform:translateY(0) scale(1)} }
@keyframes iconPop { from {transform:scale(.5);opacity:0} to {transform:scale(1);opacity:1} }
@keyframes logoPulse { 0%,100% {box-shadow:0 0 22px rgba(168,85,247,.48),0 0 45px rgba(99,102,241,.2)} 50% {box-shadow:0 0 32px rgba(168,85,247,.75),0 0 65px rgba(99,102,241,.38)} }
@keyframes orbFloat { from {transform:translate(0,0) scale(.9)} to {transform:translate(45px,35px) scale(1.18)} }
@keyframes gradientShift { 0%,100% {background-position:0% 50%} 50% {background-position:100% 50%} }
@media (max-width:480px) {
  body { padding:18px 14px; }
  .card { padding:32px 22px 24px; border-radius:26px; }
  h1 { font-size:25px; }
}
@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; transition-duration:.01ms !important; }
}
/* =================================
   RAJIB DIGITAL CENTRE
   ADVANCED FUTURISTIC ANIMATION
================================= */

/* Animated Aurora Background */

body {
    background: linear-gradient(
        -45deg,
        #080414,
        #1b0b35,
        #100d30,
        #240b46,
        #080414
    );
    background-size: 400% 400%;
    animation: auroraBackground 14s ease infinite;
    overflow-x: hidden;
}

@keyframes auroraBackground {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Floating Neon Light */

body::before,
body::after {
    content: "";
    position: fixed;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    filter: blur(100px);
    z-index: -1;
    pointer-events: none;
    animation: floatingGlow 9s ease-in-out infinite alternate;
}

body::before {
    background: #a020f0;
    top: 5%;
    left: -120px;
}

body::after {
    background: #4f46e5;
    bottom: 5%;
    right: -120px;
    animation-delay: 3s;
}

@keyframes floatingGlow {
    0% {
        transform: translate(0,0) scale(.8);
        opacity: .4;
    }
    100% {
        transform: translate(80px,60px) scale(1.3);
        opacity: .9;
    }
}

/* Premium Glass Card */

.card {
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);

    background: rgba(255,255,255,.055);

    border: 1px solid rgba(255,255,255,.15);

    box-shadow:
        0 0 30px rgba(168,85,247,.15),
        0 0 80px rgba(99,102,241,.12),
        inset 0 0 25px rgba(255,255,255,.025);

    animation: cardEntrance 1s cubic-bezier(.2,.8,.2,1);
}

@keyframes cardEntrance {
    0% {
        opacity: 0;
        transform: translateY(60px) scale(.92);
        filter: blur(10px);
    }
    100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
    }
}

/* Animated Border Glow */

.card::before {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: inherit;
    padding: 2px;

    background: linear-gradient(
        120deg,
        transparent,
        #a855f7,
        #22d3ee,
        #6366f1,
        transparent
    );

    background-size: 300% 300%;
    animation: borderGlow 6s linear infinite;

    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);

    -webkit-mask-composite: xor;
    mask-composite: exclude;

    pointer-events: none;
}

@keyframes borderGlow {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
}

/* Logo Advanced Glow */

.logo {
    animation:
        logoFloat 4s ease-in-out infinite,
        logoGlow 3s ease-in-out infinite alternate;
}

@keyframes logoFloat {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-9px); }
}

@keyframes logoGlow {
    from {
        box-shadow: 0 0 15px #a855f7;
    }
    to {
        box-shadow:
            0 0 25px #a855f7,
            0 0 55px #6366f1,
            0 0 85px #9333ea;
    }
}

/* Input Focus Animation */

input {
    transition: all .35s cubic-bezier(.2,.8,.2,1);
}

input:focus {
    transform: translateY(-2px);

    border-color: #c084fc;

    box-shadow:
        0 0 0 3px rgba(168,85,247,.15),
        0 0 20px rgba(168,85,247,.3),
        0 0 40px rgba(99,102,241,.12);
}

/* Premium Animated Button */

button {
    position: relative;
    overflow: hidden;

    background: linear-gradient(
        110deg,
        #9333ea,
        #6366f1,
        #a855f7,
        #6366f1
    );

    background-size: 300% 300%;

    animation: buttonGradient 5s ease infinite;

    box-shadow:
        0 0 15px rgba(168,85,247,.4),
        0 0 35px rgba(99,102,241,.2);

    transition: all .3s ease;
}

@keyframes buttonGradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

button:hover {
    transform: translateY(-4px) scale(1.015);

    box-shadow:
        0 0 20px #a855f7,
        0 0 45px rgba(99,102,241,.6);
}

button:active {
    transform: scale(.97);
}

/* Button Shine Effect */

button::before {
    content: "";
    position: absolute;

    top: -100%;
    left: -100%;

    width: 50%;
    height: 300%;

    background: rgba(255,255,255,.2);

    transform: rotate(35deg);

    transition: left .7s ease;
}

button:hover::before {
    left: 150%;
}

/* Success Popup Animation */

.popup {
    animation: popupEntrance .6s cubic-bezier(.16,1,.3,1);
    box-shadow:
        0 0 35px rgba(168,85,247,.3),
        0 0 80px rgba(99,102,241,.2);
}

@keyframes popupEntrance {
    0% {
        opacity: 0;
        transform: scale(.75) translateY(30px);
        filter: blur(8px);
    }

    100% {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: blur(0);
    }
}

/* Success Icon Animation */

.popup-icon {
    animation: successPulse 2s ease-in-out infinite;
}

@keyframes successPulse {
    0%,100% {
        transform: scale(1);
        text-shadow: 0 0 10px #a855f7;
    }

    50% {
        transform: scale(1.15);
        text-shadow:
            0 0 20px #a855f7,
            0 0 40px #6366f1;
    }
}

/* Smooth Form Switching */

#loginForm,
#registerForm {
    animation: formAppear .45s ease;
}

@keyframes formAppear {
    from {
        opacity: 0;
        transform: translateX(15px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }
}

/* Accessibility */

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
      }  
</style>

</head>

<body>
<div class="ambient" aria-hidden="true"></div>

<div class="card">

<div class="logo">R</div>

<div id="loginForm">
<h1>Welcome Back!</h1>
<p class="subtitle">Sign in to Rajib Digital Centre</p>

<div class="input-group">
<label>Email Address</label>
<input type="email" id="loginEmail" placeholder="Enter your email">
</div>

<div class="input-group">
<label>Password</label>
<div class="password-box">
<input type="password" id="loginPassword" placeholder="Enter password">
<span class="toggle" onclick="togglePassword('loginPassword',this)">SHOW</span>
</div>
</div>

<div class="forgot">
<a href="#" onclick="forgotPassword()">Forgot Password?</a>
</div>

<button id="loginBtn" onclick="login()">Sign In →</button>

<p class="message" id="loginMessage"></p>

<div class="switch">
Don't have an account?
<span onclick="showRegister()">Create Account</span>
</div>
</div>

<div id="registerForm">
<h1>Create Account</h1>
<p class="subtitle">Join Rajib Digital Centre</p>

<div class="input-group">
<label>Full Name</label>
<input type="text" id="regName" placeholder="Enter your name">
</div>

<div class="input-group">
<label>Email Address</label>
<input type="email" id="regEmail" placeholder="Enter your email">
</div>

<div class="input-group">
<label>Password</label>
<div class="password-box">
<input type="password" id="regPassword" placeholder="Minimum 6 characters">
<span class="toggle" onclick="togglePassword('regPassword',this)">SHOW</span>
</div>
</div>

<button id="registerBtn" onclick="register()">Create Account →</button>

<p class="message" id="registerMessage"></p>

<div class="switch">
Already have an account?
<span onclick="showLogin()">Sign In</span>
</div>
</div>

<div class="footer">
© 2026 Rajib Digital Centre. All Rights Reserved.
</div>

</div>

<div class="overlay" id="overlay">
<div class="popup">
<div class="popup-icon" id="popupIcon">✓</div>
<h2 id="popupTitle">Success!</h2>
<p id="popupText">Operation completed successfully.</p>
<button onclick="closePopup()">Continue</button>
</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    updateProfile,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyA7Fn3sXqXxLH37LFr47XEOdcbWNE5LiMw",
    authDomain: "rajib-digital-centre.firebaseapp.com",
    projectId: "rajib-digital-centre",
    storageBucket: "rajib-digital-centre.firebasestorage.app",
    messagingSenderId: "400866818079",
    appId: "1:400866818079:web:d3686ec90fdcdc780b7d2a",
    measurementId: "G-7E2DXWT8M2"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

function showPopup(title,text,icon="✓") {
    document.getElementById("popupTitle").textContent = title;
    document.getElementById("popupText").textContent = text;
    document.getElementById("popupIcon").textContent = icon;
    document.getElementById("overlay").style.display = "flex";
}

let afterPopupRedirect = "";

window.closePopup = function() {
    document.getElementById("overlay").style.display = "none";
    if (afterPopupRedirect) {
        const destination = afterPopupRedirect;
        afterPopupRedirect = "";
        window.location.replace(destination);
    }
};

window.showRegister = function() {
    document.getElementById("loginForm").style.display = "none";
    document.getElementById("registerForm").style.display = "block";
};

window.showLogin = function() {
    document.getElementById("registerForm").style.display = "none";
    document.getElementById("loginForm").style.display = "block";
};

window.togglePassword = function(id,element) {
    const input = document.getElementById(id);
    input.type = input.type === "password" ? "text" : "password";
    element.textContent = input.type === "password" ? "SHOW" : "HIDE";
};

window.register = async function() {

    const name = document.getElementById("regName").value.trim();
    const email = document.getElementById("regEmail").value.trim();
    const password = document.getElementById("regPassword").value;
    const message = document.getElementById("registerMessage");
    const btn = document.getElementById("registerBtn");

    if(!name || !email || !password) {
        message.textContent = "Please fill in all fields.";
        return;
    }

    if(password.length < 6) {
        message.textContent = "Password must be at least 6 characters.";
        return;
    }

    btn.disabled = true;
    btn.textContent = "Creating Account...";

    try {
        const credential = await createUserWithEmailAndPassword(auth,email,password);
        await updateProfile(credential.user,{displayName:name});

        afterPopupRedirect = "index.html";
        showPopup("Account Created!","Your account is ready. Continue to Rajib Digital Centre.");
        message.textContent = "";

    } catch(error) {
        message.textContent = getErrorMessage(error.code);
    } finally {
        btn.disabled = false;
        btn.textContent = "Create Account →";
    }
};

window.login = async function() {

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const message = document.getElementById("loginMessage");
    const btn = document.getElementById("loginBtn");

    if(!email || !password) {
        message.textContent = "Please enter email and password.";
        return;
    }

    btn.disabled = true;
    btn.textContent = "Signing In...";

    try {
        await signInWithEmailAndPassword(auth,email,password);

        afterPopupRedirect = "index.html";
        showPopup("Login Successful!","Welcome to Rajib Digital Centre.");

    } catch(error) {
        message.textContent = getErrorMessage(error.code);
    } finally {
        btn.disabled = false;
        btn.textContent = "Sign In →";
    }
};

window.forgotPassword = async function() {

    const email = document.getElementById("loginEmail").value.trim();

    if(!email) {
        document.getElementById("loginMessage").textContent =
        "Enter your email address first.";
        return;
    }

    try {
        await sendPasswordResetEmail(auth,email);
        showPopup("Email Sent!","Check your inbox for the password reset link.");
    } catch(error) {
        document.getElementById("loginMessage").textContent =
        getErrorMessage(error.code);
    }
};

function getErrorMessage(code) {
    const errors = {
        "auth/email-already-in-use":"This email is already registered.",
        "auth/invalid-email":"Invalid email address.",
        "auth/weak-password":"Please use a stronger password.",
        "auth/invalid-credential":"Incorrect email or password.",
        "auth/network-request-failed":"Network error. Please try again.",
        "auth/too-many-requests":"Too many attempts. Try again later."
    };
    return errors[code] || "Something went wrong. Please try again.";
}

let firstAuthCheck = true;
onAuthStateChanged(auth, user => {
    // If the visitor already has an active session, skip the login page.
    if (firstAuthCheck) {
        firstAuthCheck = false;
        if (user) window.location.replace("index.html");
    }
});

</script>

</body>
  </html>
